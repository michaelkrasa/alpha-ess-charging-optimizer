[project]
name = "alphaess-charging-optimizer"
version = "3.0.0"
description = "Optimize AlphaESS battery charging/discharging based on day-ahead electricity prices"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "alphaessopenapi>=0.0.21",
    "boto3>=1.35",
    "fastapi>=0.115",
    "highspy>=1.12",
    "httpx>=0.27",
    "mangum>=0.19",
    "ote-cr-price-fetcher>=0.1.2",
    "pandas>=2.3.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.2",
    "scipy>=1.14",
    "uvicorn>=0.30",
    "voluptuous>=0.15.2",
]

[project.optional-dependencies]
emhass = ["emhass==0.18.6", "pandas==3.0.6"]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

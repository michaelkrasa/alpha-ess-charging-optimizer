<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Household energy</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#242822;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:400px;width:100%}.brand{color:#41674b;font-size:22px;font-weight:600;letter-spacing:-.7px;margin-bottom:42px}h1{font-size:34px;font-weight:500;letter-spacing:-1px;margin:0 0 10px}p{color:#74786f;margin:0 0 28px}label{display:block;font-size:12px;margin-bottom:8px}input,button{font:inherit;border-radius:7px;padding:13px 14px;width:100%;border:1px solid #d8dbce}input{background:#fffefa}button{background:#41674b;color:white;border:0;margin-top:14px;cursor:pointer}input:focus,button:focus-visible{outline:2px solid #bd612c;outline-offset:3px}#error{color:#a33d23;font-size:13px;min-height:22px;margin-top:12px}.foot{font-size:11px;margin-top:30px}</style></head><body><main><div class="brand">◒ household / energy</div><h1>A home in balance.</h1><p>Sign in to inspect your battery and manage automatic charging.</p><form id="login"><label for="password">Household password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">Open dashboard →</button><div id="error" role="alert"></div></form><p class="foot">Private household access · Prices in EUR</p></main><script>document.getElementById('login').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;document.getElementById('error').textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Request':'dashboard'},body:JSON.stringify({password:document.getElementById('password').value})});if(!response.ok)throw Error('Incorrect password or dashboard unavailable.');location.reload()}catch(error){document.getElementById('error').textContent=error.message}finally{button.disabled=false}}</script></body></html>

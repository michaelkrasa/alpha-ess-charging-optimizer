<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Household energy</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23161616'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%23fff'/%3E%3C/svg%3E"><meta name="theme-color" content="#ffffff"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#161616;background:#f4f4f4;font:15px/1.5 Inter,"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:400px;width:100%;padding:32px;border-radius:8px;background:#fff;border:1px solid #e0e0e0}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;margin-bottom:32px}h1{font-size:28px;font-weight:400;letter-spacing:-.5px;margin:0 0 8px}p{color:#525252;margin:0 0 24px}label{display:block;font-size:12px;color:#525252;margin-bottom:8px}input,button{font:inherit;border-radius:4px;padding:12px 14px;width:100%}input{background:#f4f4f4;color:#161616;border:0;border-bottom:1px solid #8d8d8d}button{background:#0f62fe;color:#fff;font-weight:500;border:0;margin-top:16px;cursor:pointer}button:hover{background:#0353e9}button:disabled{opacity:.6;cursor:wait}input:focus,button:focus-visible{outline:2px solid #0f62fe;outline-offset:2px}#error{color:#da1e28;font-size:13px;min-height:22px;margin-top:12px}.foot{font-size:11px;margin:22px 0 0;color:#6f6f6f}</style></head><body><main><div class="brand"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#161616"/><path d="M36 8 18 36h12l-4 20 20-30H34z" fill="#fff"/></svg>Household Energy</div><h1>A home in balance.</h1><p>Sign in to inspect your battery and manage automatic charging.</p><form id="login"><label for="password">Household password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">Open dashboard →</button><div id="error" role="alert"></div></form><p class="foot">Private household access · Prices in EUR</p></main><script>document.getElementById('login').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;document.getElementById('error').textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Request':'dashboard'},body:JSON.stringify({password:document.getElementById('password').value})});if(!response.ok)throw Error('Incorrect password or dashboard unavailable.');location.reload()}catch(error){document.getElementById('error').textContent=error.message}finally{button.disabled=false}}</script></body></html>
